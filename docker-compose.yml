# docker-compose.yml
# Stack: MinIO (S3) + Nessie (Iceberg catalog) + Dremio OSS + Airflow (LocalExecutor) + Postgres (Airflow metadata)
#
# Быстрый старт:
#   1) docker compose up -d
#   2) MinIO:   http://localhost:9001  (admin / password)
#   3) Dremio:  http://localhost:9047  (создашь admin при первом входе)
#   4) Airflow: http://localhost:8080  (airflow / airflow)
#
# В Dremio добавь Source типа "Nessie":
#   General:
#     Nessie endpoint: http://nessie:19120/api/v2
#     Auth: None
#   Storage:
#     Root path:       /warehouse/iceberg
#     Access key:      admin
#     Secret key:      password
#   Advanced Options / Connection Properties:
#     fs.s3a.endpoint:           minio:9000
#     fs.s3a.path.style.access:  true
#     fs.s3a.connection.ssl.enabled: false
#     dremio.s3.compat:          true

name: lakehouse

services:
  # ----------------------------
  # MinIO (S3 compatible storage)
  # ----------------------------
  minio:
    image: minio/minio:RELEASE.2023-05-04T21-44-30Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - iceberg-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # init buckets/prefixes
  mc:
    image: minio/mc:RELEASE.2023-05-04T18-10-16Z
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - iceberg-net
    entrypoint: >
      /bin/sh -lc "
        /usr/bin/mc config host add minio http://minio:9000 admin password;
        /usr/bin/mc mb -p minio/warehouse || true;
        # префикс для Iceberg
        /usr/bin/mc mb -p minio/warehouse/iceberg || true;
        /usr/bin/mc ls minio;
        tail -f /dev/null
      "

  # ----------------------------
  # Nessie catalog (Iceberg)
  # ----------------------------
  nessie:
    image: projectnessie/nessie
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      # default in-memory store is fine for demo; for persistence use ROCKSDB (see note below)
      QUARKUS_HTTP_PORT: "19120"
    networks:
      - iceberg-net

  # ----------------------------
  # Dremio OSS
  # ----------------------------
  dremio:
    image: dremio/dremio-oss:24.3.0
    container_name: dremio
    platform: linux/x86_64
    depends_on:
      - nessie
      - minio
    ports:
      - "9047:9047"   # UI
      - "31010:31010" # JDBC/ODBC
      - "32010:32010" # Flight (Arrow)
    volumes:
      - dremio_data:/opt/dremio/data
    networks:
      - iceberg-net
    # Не трогаем paths.dist — это часто ломает внутренние пути.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ----------------------------
  # Airflow metadata DB
  # ----------------------------
  airflow-db:
    image: postgres:15
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    networks:
      - iceberg-net

  # ----------------------------
  # Airflow (webserver + scheduler)
  # ----------------------------
  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow-init
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "change-me"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    networks:
      - iceberg-net
    entrypoint: >
      /bin/bash -lc "
        airflow db migrate &&
        airflow users create
          --username $$(_AIRFLOW_WWW_USER_USERNAME)
          --password $$(_AIRFLOW_WWW_USER_PASSWORD)
          --firstname Airflow --lastname Admin
          --role Admin
          --email admin@example.com || true
      "

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Примеры переменных для DAG (подключение к Dremio Flight/JDBC)
      DREMIO_HOST: dremio
      DREMIO_FLIGHT_PORT: "32010"
      DREMIO_USER: admin
      DREMIO_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    networks:
      - iceberg-net
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DREMIO_HOST: dremio
      DREMIO_FLIGHT_PORT: "32010"
      DREMIO_USER: admin
      DREMIO_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    networks:
      - iceberg-net
    command: scheduler

networks:
  iceberg-net:

volumes:
  minio_data:
  dremio_data:
  airflow_db:
  airflow_logs:
